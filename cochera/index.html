const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}};

 if(S.col){const id=v.id;S.chain[id]=(S.chain[id]||Promise.resolve()).then(()=>V[id]?S.col.doc(id).set(V[id]):null).catch(e=>toast(e&&e.code==='quota_exceeded'?'Almacenamiento lleno':'No se pudo guardar'))}
 else lsSet(LK,V);

function drop(id){

 if(S.col)S.chain[id]=(S.chain[id]||Promise.resolve()).then(()=>S.col.doc(id).delete()).catch(()=>toast('No se pudo borrar'));

async function connect(){
 if(!window.claude||typeof window.claude.use!=='function')return;
 (async()=>{try{const sm=await window.claude.use('sample');if(sm){const lim=await sm.limits().catch(()=>null);if(lim&&lim.images){S.sample=sm;S.scan=true}}}catch(e){}})();
 const timer=setTimeout(()=>{S.slow=true;render()},10000);
 try{
  const db=await window.claude.use('db'),user=await window.claude.use('user');
  const id=user?await user.id():null;
  if(!db||!id){clearTimeout(timer);return}
  S.col=db.collection('data/users/'+id);
  const cached=lsGet(CK);if(cached&&!Object.keys(V).length){V=cached;render()}
  let first=true;
  S.col.onSnapshot(snap=>{
   const nv={};
   for(const d of snap.docs){const x=d.data();if(x&&Array.isArray(x.records))nv[d.id]=JSON.parse(JSON.stringify(x))}
   if(!snap.metadata.fromCache){
    clearTimeout(timer);S.slow=false;
    if(first){first=false;const loc=lsGet(LK);
     if(loc&&snap.empty&&Object.keys(loc).length){for(const v of Object.values(loc)){nv[v.id]=v}V=nv;for(const v of Object.values(loc))persist(v)}
     try{localStorage.removeItem(LK)}catch(e){}}
   }
   V=nv;lsSet(CK,V);render();
  },()=>{clearTimeout(timer);S.err=true;render()});
 }catch(e){clearTimeout(timer)}
}

const sortR=rs=>rs.slice().sort((a,b)=>b.date.localeCompare(a.date)||(+b.km||0)-(+a.km||0));

function sums(rs){const s={fuel:0,serv:0,mod:0,doc:0,tot:0};for(const r of rs){const c=ty(r.type).cat;s[c]+=+r.cost||0;s.tot+=+r.cost||0}return s}
function kmIn(v,y){
 const k=v.records.filter(r=>+r.km>0).sort((a,b)=>a.date.localeCompare(b.date));
 const inY=k.filter(r=>r.date.startsWith(y+'-'));if(!inY.length)return 0;
 const before=k.filter(r=>r.date<y+'-01-01').pop();
 const start=before?+before.km:+inY[0].km;let end=Math.max(...inY.map(r=>+r.km));
 if(y===new Date().getFullYear())end=Math.max(end,+v.km||0);
 return Math.max(0,end-start);
}
function consumption(v){
 const f=v.records.filter(r=>r.type==='fuel'&&+r.km>0&&+r.liters>0).sort((a,b)=>+a.km-+b.km);
 if(f.length<2)return null;const d=+f[f.length-1].km-+f[0].km;if(d<50)return null;
 return f.slice(1).reduce((a,r)=>a+(+r.liters),0)/d*100;
}
const ivl=(v,t)=>({km:T[t]?.km||0,m:T[t]?.m||0,...((v.intervals||{})[t]||{})});
function remind(v,t){
 const tt=T[t],last=recs(v,r=>r.type===t)[0],now=today0();
 if(tt.doc){
  if(!last||!last.expiry)return{v,t,last,state:'none'};
  const days=Math.round((pd(last.expiry)-now)/864e5),tot=Math.max(1,Math.round((pd(last.expiry)-pd(last.date))/864e5));
  return{v,t,last,days,frac:days/tot,state:days<0?'late':days<=30?'soon':'ok'};
 }
 const iv=ivl(v,t);if(!iv.km&&!iv.m)return null;
 if(!last)return{v,t,last,iv,state:'none'};
 const fr=[];let kmLeft=null,mLeft=null,fk=null,fm=null;
 if(iv.km&&+last.km>0){kmLeft=+last.km+iv.km-curKm(v);fk=kmLeft/iv.km;fr.push(fk)}
 if(iv.m){mLeft=(addMonths(pd(last.date),iv.m)-now)/(864e5*30.44);fm=mLeft/iv.m;fr.push(fm)}
 if(!fr.length)return{v,t,last,iv,state:'none'};
 const frac=Math.min(...fr);
 return{v,t,last,iv,kmLeft,mLeft,fk,fm,frac,state:frac<0?'late':frac<.15?'soon':'ok'};
}
const mtxt=m=>{const n=Math.round(m);return n<1?'menos de 1 mes':n===1?'1 mes':n+' meses'};

const rems=v=>{let r=RM.get(v);if(!r){r=Object.keys(T).filter(t=>okFor(t,v)).map(t=>remind(v,t)).filter(Boolean);RM.set(v,r)}return r};
function remText(r){
 if(r.state==='none')return['Sin registros · toca para añadir','var(--mute)'];
 const col=r.state==='late'?'var(--red)':r.state==='soon'?'var(--amber)':'var(--green)';
 if(T[r.t].doc){const d=r.days;return[d<0?`Vencido hace ${-d} días`:d===0?'Vence hoy':d<=60?`Vence en ${d} días`:`Vence el ${fdate(r.last.expiry)}`,col]}
 if(r.state==='late'){const p=[];if(r.kmLeft!=null&&r.kmLeft<0)p.push(`${kmf(-r.kmLeft)} pasado`);if(r.mLeft!=null&&r.mLeft<0)p.push(mtxt(-r.mLeft)+' pasado'+(Math.round(-r.mLeft)>1?'s':''));return['Atrasado'+(p.length?' · '+p.join(' · '):''),col]}
 const p=[];if(r.kmLeft!=null)p.push(`${kmf(r.kmLeft)} restantes`);if(r.mLeft!=null)p.push(mtxt(r.mLeft));

}
function forecast(vs){
 const now=today0(),in1=addDays(now,365),ago=addDays(now,-365);let ren=0,run=0;
 for(const v of vs){
  for(const t of DOCS){const l=recs(v,r=>r.type===t)[0];if(l&&l.expiry&&pd(l.expiry)<=in1)ren+=+l.cost||0}
  for(const r of v.records){const c=ty(r.type).cat;if((c==='fuel'||c==='serv')&&pd(r.date)>=ago)run+=+r.cost||0}
 }
 return{ren,run,tot:ren+run};
}
function nextRen(vs){
 let best=null;

 return best;
}

 const t=e.target;
 if(t.id==='q'){ui.q=t.value;$('#grid').innerHTML=addGrid();return}
 if(t.id==='hq'){ui.hq=t.value;ui.hn=60;clearTimeout(hqT);hqT=setTimeout(render,180);return}
 if(P&&/^adj-[sxy]$/.test(t.id)){const k=t.id.slice(4);P.adj[k]=k==='s'?(+t.value)/100:+t.value;applyAdj();return}
 const f=t.closest('#frec');if(!f)return;
 if(t.dataset.l)sumLines(f);
 if(t.name==='liters'||t.name==='ppl'){const l=num(f.elements.liters.value),p=num(f.elements.ppl.value);if(l&&p)f.elements.cost.value=dec((l*p).toFixed(2))}
});
document.addEventListener('change',async e=>{
 if(e.target.name==='set_theme'){SET.theme=e.target.value;saveSet();applyTheme();haptic();return}
 if(e.target.name==='set_hap'){SET.hap=e.target.value==='true';saveSet();haptic();return}
 if(e.target.type==='radio'||e.target.type==='checkbox')haptic();
 if(e.target.dataset&&e.target.dataset.oth){const o=document.getElementById(e.target.dataset.oth);if(o){o.hidden=e.target.value!=='__other';if(!o.hidden){const i=o.querySelector('input');i&&i.focus()}}return}
 if(e.target.form&&e.target.name&&e.target.name.startsWith('x_')){updateWhen(e.target.form);if(e.target.name==='x_res')itvAuto(e.target.form)}
 if(e.target.name==='date'&&e.target.form&&e.target.form.dataset.t==='itv'&&!e.target.form.dataset.r)itvAuto(e.target.form);
 if(e.target.name==='shopSel'){const o=$('#shopOther');if(o){o.hidden=e.target.value!=='__other';if(!o.hidden){const i=o.querySelector('input');i&&i.focus()}}return}
 if(e.target.id==='scanf'&&e.target.files[0]){scanTicket(e.target.files[0],e.target.closest('form'));return}
 if(e.target.name==='date'&&e.target.closest('#frec')){e.target.closest('form').querySelectorAll('[data-act=setDate]').forEach(x=>x.classList.toggle('on',x.dataset.d===e.target.value))}
 if(e.target.id==='phf'&&e.target.files[0]){try{toast('Preparando foto…');P.proc=await processPhoto(e.target.files[0]);P.src=URL.createObjectURL(P.proc.blob);P.alpha=P.proc.alpha;P.adj={...ADJ0};P.changed=true;$('#ph').innerHTML=phEditor()}catch(err){toast('No se pudo leer la foto')}}
});
document.addEventListener('submit',e=>{
 e.preventDefault();const f=e.target;
 if(f.id==='frec')submitRec(f);
 else if(f.id==='fveh')submitVeh(f);
 else if(f.id==='fspec')submitSpec(f);
 else if(f.id==='fkm'){const v=V[f.dataset.id],km=int(f.elements.km.value);if(!v)return;if(km==null){f.elements.km.focus();return}if(km<curKm(v)-5&&!f.dataset.ok){f.dataset.ok=1;toast('Es menos que antes. Pulsa otra vez para confirmar');return}v.km=km;v.kmAt=iso(today0());haptic();save(v);toast('Kilómetros actualizados')}
 else if(f.id==='fodo'){const v=V[f.dataset.id],km=int(f.elements.km.value);if(v&&km!=null){v.km=km;v.kmAt=iso(today0());save(v);closeSheet();haptic();toast('Kilómetros actualizados')}}
 else if(f.id==='fival'){const v=V[f.dataset.v];v.intervals=v.intervals||{};v.intervals[f.dataset.t]={km:int(f.elements.km.value)||0,m:int(f.elements.m.value)||0};save(v);closeSheet()}
 else if(f.id==='frest'){try{const arr=JSON.parse(f.elements.t.value);if(!Array.isArray(arr))throw 0;let n=0;
  for(const v of arr){if(v&&typeof v.id==='string'&&/^[A-Za-z0-9_-]{1,60}$/.test(v.id)&&Array.isArray(v.records)){save(v);n++}}
  closeSheet();toast(n?`${n} vehículo${n>1?'s':''} restaurado${n>1?'s':''}`:'No había vehículos en la copia')}catch(err){toast('Ese texto no es una copia válida')}}
});

/* ---------- gestos ---------- */
const TABS=['home','rem','add','hist','garage'];
let G=null,noClick=false,hqT;
const noGesture=el=>el.closest('.chips,.vchips,.bars,.tchips,.sw,.subt,.seg,input,textarea,select,.ed-stage,#tabs,.sheet,.dchips');
const viewEl=$('#view');
viewEl.addEventListener('pointerdown',e=>{if(PMr){cancelAnimationFrame(PMr);PMr=0}
 if(e.pointerType==='mouse'&&e.button!==0)return;if(noGesture(e.target))return;
 G={x:e.clientX,y:e.clientY,t:Date.now(),id:e.pointerId,row:e.target.closest('.swr'),stage:e.target.closest('.stage'),dir:null};
});
let PM=null,PMr=0;
window.addEventListener('pointermove',e=>{PM=e;if(!PMr)PMr=requestAnimationFrame(()=>{PMr=0;onMove(PM)})},{passive:true});
function onMove(e){
 if(!G||e.pointerId!==G.id)return;const dx=e.clientX-G.x,dy=e.clientY-G.y;
 if(!G.dir){if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.5)G.dir='h';else if(Math.abs(dy)>10){G=null;return}}
 if(G.dir!=='h')return;
 if(G.row){const base=G.row.classList.contains('open')?-96:0,x=Math.min(0,Math.max(-140,base+dx));const c=G.row.querySelector('.swc');c.style.transition='none';c.style.transform=`translateX(${x}px)`;return}
 if(G.stage){const c=G.stage.querySelector('.car');if(c){c.style.transition='none';c.style.transform=`translateX(${dx*.7}px) rotate(${dx*.015}deg)`;c.style.opacity=String(1-Math.min(.6,Math.abs(dx)/400))}return}
 const edge=ui.stack.length?Math.max(0,dx):dx;viewEl.style.willChange='transform';viewEl.style.transition='none';viewEl.style.transform=`translateX(${edge*(ui.stack.length?.55:.25)}px)`;
}
function endGesture(e,cancel){
 if(!G||(e&&e.pointerId!==G.id))return;const g=G;G=null;
 const dx=e?e.clientX-g.x:0,fast=Date.now()-g.t<260&&Math.abs(dx)>40;
 const reset=el=>{if(!el)return;setTimeout(()=>{el.style.willChange=''},320);el.style.transition='transform .3s cubic-bezier(.2,.9,.3,1.2),opacity .3s';el.style.transform='';el.style.opacity=''};
 if(g.dir!=='h'){return}
 noClick=true;setTimeout(()=>noClick=false,350);
 if(cancel){reset(viewEl);if(g.row)reset(g.row.querySelector('.swc'));if(g.stage)reset(g.stage.querySelector('.car'));return}
 if(g.row){const c=g.row.querySelector('.swc');const open=(g.row.classList.contains('open')?-96:0)+dx<-48;document.querySelectorAll('.swr.open').forEach(r=>{if(r!==g.row)r.classList.remove('open')});g.row.classList.toggle('open',open);c.style.transition='';c.style.transform='';return}
 if(g.stage){reset(g.stage.querySelector('.car'));if(Math.abs(dx)>50||fast)A.cur({d:dx<0?1:-1});return}
 reset(viewEl);
 if(ui.stack.length){if(dx>80||(fast&&dx>0))A.back();return}
 if(Math.abs(dx)>90||fast){const i=TABS.indexOf(ui.tab),j=i+(dx<0?1:-1);if(j>=0&&j<TABS.length)tab(TABS[j])}
}
window.addEventListener('pointerup',e=>{if(PMr){cancelAnimationFrame(PMr);PMr=0;onMove(PM)}endGesture(e,false)});
window.addEventListener('pointercancel',e=>endGesture(e,true));
document.addEventListener('click',e=>{
 if(noClick&&!e.target.closest('.sheet')){e.preventDefault();e.stopImmediatePropagation();return}
 const open=document.querySelector('.swr.open');
 if(open&&!e.target.closest('.swd')){open.classList.remove('open');if(open.contains(e.target)){e.preventDefault();e.stopImmediatePropagation()}}
},true);
/* hoja: deslizar hacia abajo para cerrar */
let SG=null;
sc.addEventListener('pointerdown',e=>{
 const onHead=e.target.closest('.grab,.sh');if(!onHead||e.target.closest('button:not(.grab),input,select,textarea,label'))return;
 SG={y:e.clientY,t:Date.now(),id:e.pointerId};try{sc.setPointerCapture(e.pointerId)}catch(err){}
});
sc.addEventListener('pointermove',e=>{if(!SG||e.pointerId!==SG.id)return;const dy=Math.max(0,e.clientY-SG.y);sc.style.transition='none';sc.style.transform=`translateY(${dy}px)`;sheetEl.style.background=`rgba(20,24,30,${.35*Math.max(0,1-dy/500)})`});
const sheetEnd=e=>{if(!SG||e.pointerId!==SG.id)return;const dy=e.clientY-SG.y,fast=Date.now()-SG.t<250&&dy>30;SG=null;sc.style.transition='';sheetEl.style.background='';if(dy>110||fast)closeSheet();else sc.style.transform=''};
sc.addEventListener('pointerup',sheetEnd);sc.addEventListener('pointercancel',sheetEnd);
/* contar cifras */
function countUp(root){
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 root.querySelectorAll('.cnt').forEach(el=>{const to=+el.dataset.v||0,f=el.dataset.f,t0=performance.now(),D=900;
  const fmt=x=>f==='eur'?eur(x):nf0.format(Math.round(x));
  const step=t=>{const k=Math.min(1,(t-t0)/D),e2=1-Math.pow(1-k,3);el.textContent=fmt(to*e2);if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)});
}

render();
connect();
try{if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js",{scope:"./"}).catch(()=>{})}catch(e){}
}
</script>
</body>
</html>
