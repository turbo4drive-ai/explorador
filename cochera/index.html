/* ---------- datos ---------- */
const LK='cochera-local-v1',CK='cochera-cache-v1';
const S={col:null,chain:{},slow:false,err:false};
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let V=lsGet(LK)||{};
const list=()=>Object.values(V).filter(v=>v&&Array.isArray(v.records)).sort((a,b)=>(a.created||0)-(b.created||0));
function persist(v){
 if(S.col){const id=v.id;S.chain[id]=(S.chain[id]||Promise.resolve()).then(()=>V[id]?S.col.doc(id).set(V[id]):null).catch(e=>toast(e&&e.code==='quota_exceeded'?'Almacenamiento lleno':'No se pudo guardar'))}
 else lsSet(LK,V);
}
function save(v){
 if(JSON.stringify(v).length>250000){toast('Demasiados datos: prueba con una foto más pequeña');return false}
 V[v.id]=v;render();persist(v);return true;
}
function drop(id){
 delete V[id];render();
 if(S.col)S.chain[id]=(S.chain[id]||Promise.resolve()).then(()=>S.col.doc(id).delete()).catch(()=>toast('No se pudo borrar'));
 else lsSet(LK,V);
}
async function connect(){
 if(!window.claude||typeof window.claude.use!=='function')return;
 const timer=setTimeout(()=>{S.slow=true;render()},10000);
 try{
  const db=await window.claude.use('db'),user=await window.claude.use('user');
  const id=user?await user.id():null;
  if(!db||!id){clearTimeout(timer);return}
  S.col=db.collection('data/users/'+id);
  const cached=lsGet(CK);if(cached&&!Object.keys(V).length){V=cached;render()}
  let first=true;
  S.col.onSnapshot(snap=>{
   const nv={};
   for(const d of snap.docs){const x=d.data();if(x&&Array.isArray(x.records))nv[d.id]=JSON.parse(JSON.stringify(x))}
   if(!snap.metadata.fromCache){
    clearTimeout(timer);S.slow=false;
    if(first){first=false;const loc=lsGet(LK);
     if(loc&&snap.empty&&Object.keys(loc).length){for(const v of Object.values(loc)){nv[v.id]=v}V=nv;for(const v of Object.values(loc))persist(v)}
     try{localStorage.removeItem(LK)}catch(e){}}
   }
   V=nv;lsSet(CK,V);render();genAll();
  },()=>{clearTimeout(timer);S.err=true;render()});
 }catch(e){clearTimeout(timer)}
}

/* ---------- cálculos ---------- */
const sortR=rs=>rs.slice().sort((a,b)=>b.date.localeCompare(a.date)||(+b.km||0)-(+a.km||0));
const recs=(v,f)=>sortR(v.records.filter(f||(()=>true)));
const curKm=v=>Math.max(+v.km||0,...v.records.map(r=>+r.km||0));
const vname=v=>v.model||v.make||'Vehículo';
const vfull=v=>[v.make,v.model].filter(Boolean).join(' ')||'Vehículo';
const ini=v=>(v.make||v.model||'?').trim().slice(0,2).toUpperCase();
const yr=(v,y)=>v.records.filter(r=>String(r.date).startsWith(y+'-'));
function sums(rs){const s={fuel:0,serv:0,mod:0,doc:0,fix:0,tot:0};for(const r of rs){const c=ty(r.type).cat;s[c]+=+r.cost||0;s.tot+=+r.cost||0}return s}
function kmIn(v,y){
 const k=v.records.filter(r=>+r.km>0).sort((a,b)=>a.date.localeCompare(b.date));
 const inY=k.filter(r=>r.date.startsWith(y+'-'));if(!inY.length)return 0;
 const before=k.filter(r=>r.date<y+'-01-01').pop();
 const start=before?+before.km:+inY[0].km;let end=Math.max(...inY.map(r=>+r.km));
 if(y===new Date().getFullYear())end=Math.max(end,+v.km||0);
 return Math.max(0,end-start);
}
function consumption(v){
 const f=v.records.filter(r=>r.type==='fuel'&&+r.km>0&&+r.liters>0).sort((a,b)=>+a.km-+b.km);
 if(f.length<2)return null;const d=+f[f.length-1].km-+f[0].km;if(d<50)return null;
 return f.slice(1).reduce((a,r)=>a+(+r.liters),0)/d*100;
}
const ivl=(v,t)=>({km:T[t]?.km||0,m:T[t]?.m||0,...((v.intervals||{})[t]||{})});
function remind(v,t){
 const tt=T[t],last=recs(v,r=>r.type===t)[0],now=today0();
 if(tt.doc){
  if(!last||!last.expiry)return{v,t,last,state:'none'};
  const days=Math.round((pd(last.expiry)-now)/864e5),tot=Math.max(1,Math.round((pd(last.expiry)-pd(last.date))/864e5));
  return{v,t,last,days,frac:days/tot,state:days<0?'late':days<=30?'soon':'ok'};
 }
 const iv=ivl(v,t);if(!iv.km&&!iv.m)return null;
 if(!last)return{v,t,last,iv,state:'none'};
 const fr=[];let kmLeft=null,mLeft=null,fk=null,fm=null;
 if(iv.km&&+last.km>0){kmLeft=+last.km+iv.km-curKm(v);fk=kmLeft/iv.km;fr.push(fk)}
 if(iv.m){mLeft=(addMonths(pd(last.date),iv.m)-now)/(864e5*30.44);fm=mLeft/iv.m;fr.push(fm)}
 if(!fr.length)return{v,t,last,iv,state:'none'};
 const frac=Math.min(...fr);
 return{v,t,last,iv,kmLeft,mLeft,fk,fm,frac,state:frac<0?'late':frac<.15?'soon':'ok'};
}
const mtxt=m=>{const n=Math.round(m);return n<1?'menos de 1 mes':n===1?'1 mes':n+' meses'};
let RM=new WeakMap();
const rems=v=>{let r=RM.get(v);if(!r){r=Object.keys(T).filter(t=>okFor(t,v)).map(t=>remind(v,t)).filter(Boolean);RM.set(v,r)}return r};
function remText(r){
 if(r.state==='none')return['Sin registros · toca para añadir','var(--mute)'];
 const col=r.state==='late'?'var(--red)':r.state==='soon'?'var(--amber)':'var(--green)';
 if(T[r.t].doc){const d=r.days;return[d<0?`Vencido hace ${-d} días`:d===0?'Vence hoy':d<=60?`Vence en ${d} días`:`Vence el ${fdate(r.last.expiry)}`,col]}
 if(r.state==='late'){const p=[];if(r.kmLeft!=null&&r.kmLeft<0)p.push(`${kmf(-r.kmLeft)} pasado`);if(r.mLeft!=null&&r.mLeft<0)p.push(mtxt(-r.mLeft)+' pasado'+(Math.round(-r.mLeft)>1?'s':''));return['Atrasado'+(p.length?' · '+p.join(' · '):''),col]}
 const p=[];if(r.kmLeft!=null)p.push(`${kmf(r.kmLeft)} restantes`);if(r.mLeft!=null)p.push(mtxt(r.mLeft));
 return[p.join(' · '),col];
}
function forecast(vs){
 const now=today0(),in1=addDays(now,365),ago=addDays(now,-365);let ren=0,run=0;
 for(const v of vs){
  for(const t of DOCS){const l=recs(v,r=>r.type===t)[0];if(l&&l.expiry&&pd(l.expiry)<=in1)ren+=+l.cost||0}
  for(const r of v.records){const c=ty(r.type).cat;if((c==='fuel'||c==='serv')&&pd(r.date)>=ago)run+=+r.cost||0}
 }
 return{ren,run,tot:ren+run};
}
function nextRen(vs){
 let best=null;
 for(const v of vs)for(const t of DOCS){const r=remind(v,t);if(r&&r.state!=='none'&&(!best||r.days<best.days))best=r}
 return best;
}
function years(){const s=new Set([new Date().getFullYear()]);for(const v of list())for(const r of v.records)s.add(+String(r.date).slice(0,4));return[...s].filter(Boolean).sort((a,b)=>b-a)}

function monthStats(v){

 const from=iso(addMonths(new Date(now.getFullYear(),now.getMonth(),1),-12)).slice(0,7);
 const past=v.records.filter(r=>{const m=r.date.slice(0,7);return m>=from&&m<ym});
 const first=past.map(r=>r.date.slice(0,7)).sort()[0];let n=1;
 if(first){const[fy,fm]=first.split('-').map(Number);n=Math.max(1,Math.min(12,(now.getFullYear()-fy)*12+(now.getMonth()+1-fm)))}

}

const inClaude=()=>!!(window.claude&&typeof window.claude.use==='function'&&window.parent!==window);

  `SUMMARY:${icsEsc(T[rm.t].n+' · '+vname(v))}`,`DESCRIPTION:${icsEsc((doc?'Vence: ':'Toca: ')+T[rm.t].n+' de tu '+vfull(v)+'. Aviso de Glovebox.')}`,
  'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${icsEsc(T[rm.t].n+' · '+vname(v))}`,`TRIGGER:-P${doc?7:3}D`,'END:VALARM',
  'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${icsEsc(T[rm.t].n+' · '+vname(v))}`,'TRIGGER:-PT15H','END:VALARM','END:VEVENT'].join('\r\n');
}
function icsOpen(evs,name){
 const body=evs.filter(Boolean);if(!body.length){toast('No hay fechas que añadir');return}
 const txt=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Glovebox//ES','CALSCALE:GREGORIAN','METHOD:PUBLISH',...body,'END:VCALENDAR'].join('\r\n');
 haptic();
 if(/iPhone|iPad|iPod/.test(navigator.userAgent)){location.href='data:text/calendar;charset=utf-8,'+encodeURIComponent(txt);return}
 const u=URL.createObjectURL(new Blob([txt],{type:'text/calendar'})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000);
}
function calButtons(v,rm){
 const g=gcalUrl(v,rm);if(!g)return '';

let SG=null;
sc.addEventListener('pointerdown',e=>{
 const onHead=e.target.closest('.grab,.sh');if(!onHead||e.target.closest('button:not(.grab),input,select,textarea,label'))return;
 SG={y:e.clientY,t:Date.now(),id:e.pointerId};try{sc.setPointerCapture(e.pointerId)}catch(err){}
});
sc.addEventListener('pointermove',e=>{if(!SG||e.pointerId!==SG.id)return;const dy=Math.max(0,e.clientY-SG.y);sc.style.transition='none';sc.style.transform=`translateY(${dy}px)`;sheetEl.style.background=`rgba(20,24,30,${.35*Math.max(0,1-dy/500)})`});
const sheetEnd=e=>{if(!SG||e.pointerId!==SG.id)return;const dy=e.clientY-SG.y,fast=Date.now()-SG.t<250&&dy>30;SG=null;sc.style.transition='';sheetEl.style.background='';if(dy>110||fast)closeSheet();else sc.style.transform=''};
sc.addEventListener('pointerup',sheetEnd);sc.addEventListener('pointercancel',sheetEnd);
/* contar cifras */
function countUp(root){
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 root.querySelectorAll('.cnt').forEach(el=>{const to=+el.dataset.v||0,f=el.dataset.f,t0=performance.now(),D=900;
  const fmt=x=>f==='eur'?eur(x):nf0.format(Math.round(x));
  const step=t=>{const k=Math.min(1,(t-t0)/D),e2=1-Math.pow(1-k,3);el.textContent=fmt(to*e2);if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)});
}

try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persisted().then(p=>p||navigator.storage.persist()).catch(()=>{})}catch(e){}
if(SET.pin)pinShow('unlock');
render();
genAll();
onbMaybe();
connect();
try{if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js",{scope:"./"}).catch(()=>{})}catch(e){}
}
</script>
